<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050507;
    --neon-cyan: #00f6ff;
    --neon-magenta: #ff2ec4;
    --neon-yellow: #ffe600;
    --grid: rgba(0, 246, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--neon-cyan);
    font-family: "Press Start 2P", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    image-rendering: pixelated;
  }

  /* retro scrolling grid floor */
  .grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    animation: gridmove 6s linear infinite;
    z-index: 0;
  }
  @keyframes gridmove {
    from { background-position: 0 0; }
    to { background-position: 0 120px; }
  }

  /* CRT scanlines + flicker */
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.35) 3px,
      rgba(0, 0, 0, 0) 4px
    );
    mix-blend-mode: multiply;
  }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.9);
  }

  .stage {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 48px 32px;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    margin: 0 0 40px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--neon-magenta);
    text-shadow:
      0 0 6px var(--neon-magenta),
      0 0 18px var(--neon-magenta),
      0 0 40px var(--neon-magenta),
      4px 4px 0 #1a0014;
    animation: flicker 3.5s infinite;
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 55% { opacity: 0.6; }
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    background: var(--neon-magenta);
    margin-left: 6px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .link-wrap {
    display: inline-block;
  }

  a.pixel-btn {
    position: relative;
    display: inline-block;
    font-family: inherit;
    font-size: clamp(0.85rem, 2.4vw, 1.1rem);
    color: var(--bg);
    background: var(--neon-yellow);
    text-decoration: none;
    padding: 18px 32px;
    letter-spacing: 2px;
    text-transform: uppercase;
    image-rendering: pixelated;
    box-shadow:
      -6px 0 0 0 #000,
      6px 0 0 0 #000,
      0 -6px 0 0 #000,
      0 6px 0 0 #000,
      -6px -6px 0 0 #000,
      6px -6px 0 0 #000,
      -6px 6px 0 0 #000,
      6px 6px 0 0 #000,
      0 0 0 6px var(--neon-yellow),
      10px 10px 0 0 var(--neon-cyan);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  a.pixel-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow:
      -6px 0 0 0 #000,
      6px 0 0 0 #000,
      0 -6px 0 0 #000,
      0 6px 0 0 #000,
      -6px -6px 0 0 #000,
      6px -6px 0 0 #000,
      -6px 6px 0 0 #000,
      6px 6px 0 0 #000,
      0 0 0 6px var(--neon-yellow),
      12px 12px 0 0 var(--neon-magenta);
  }
  a.pixel-btn:active {
    transform: translate(4px, 4px);
    box-shadow:
      -6px 0 0 0 #000,
      6px 0 0 0 #000,
      0 -6px 0 0 #000,
      0 6px 0 0 #000,
      -6px -6px 0 0 #000,
      6px -6px 0 0 #000,
      -6px 6px 0 0 #000,
      6px 6px 0 0 #000,
      0 0 0 6px var(--neon-yellow),
      2px 2px 0 0 var(--neon-cyan);
  }

  .blink-hint {
    margin-top: 44px;
    font-size: 0.6rem;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    opacity: 0.8;
    animation: blink 1.2s steps(1) infinite;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="stage">
    <h1>hello<span class="cursor">&nbsp;</span></h1>
    <p class="link-wrap">
      <a class="pixel-btn" href="https://flobrun.github.io/quiz.html" target="_blank" rel="noopener">Zum Quiz</a>
    </p>
    <p class="blink-hint">.........</p>
  </div>

  <div class="scanlines"></div>
  <div class="vignette"></div>
</body>
</html>
